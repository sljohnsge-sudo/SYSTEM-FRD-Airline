<style>
    /* Chatbot Styles */
    #aeronexa-chatbot {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 9999;
        font-family: 'Inter', sans-serif;
    }
    
    #chatbot-toggle {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ac031c, #c3122e);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(195, 18, 46, 0.4);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    #chatbot-toggle:hover {
        transform: scale(1.1);
    }
    
    #chatbot-window {
        position: absolute;
        bottom: 80px;
        right: 0;
        width: 350px;
        height: 500px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        display: none;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #e2e8f0;
        transform-origin: bottom right;
        transform: scale(0.9);
        opacity: 0;
        transition: all 0.3s ease;
    }
    
    #chatbot-window.open {
        display: flex;
        transform: scale(1);
        opacity: 1;
    }
    
    .chat-header {
        background: linear-gradient(135deg, #ac031c, #c3122e);
        color: white;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .chat-header h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .chat-header .status-dot {
        width: 8px;
        height: 8px;
        background: #4ade80;
        border-radius: 50%;
        display: inline-block;
        box-shadow: 0 0 10px #4ade80;
    }
    
    .close-chat {
        background: rgba(255,255,255,0.2);
        border: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
    }
    
    .close-chat:hover {
        background: rgba(255,255,255,0.3);
    }
    
    .chat-body {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    
    .chat-msg {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        position: relative;
    }
    
    .msg-bot {
        background: white;
        color: #1e293b;
        border: 1px solid #e2e8f0;
        border-bottom-left-radius: 4px;
        align-self: flex-start;
        box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    
    .msg-user {
        background: #c3122e;
        color: white;
        border-bottom-right-radius: 4px;
        align-self: flex-end;
        box-shadow: 0 2px 5px rgba(195, 18, 46, 0.2);
    }
    
    .chat-input-area {
        padding: 15px;
        background: white;
        border-top: 1px solid #e2e8f0;
        display: flex;
        gap: 10px;
        align-items: center;
    }
    
    .chat-input {
        flex: 1;
        border: 1px solid #cbd5e1;
        padding: 12px 15px;
        border-radius: 20px;
        outline: none;
        font-size: 14px;
        transition: border-color 0.2s;
    }
    
    .chat-input:focus {
        border-color: #c3122e;
    }
    
    .chat-send-btn {
        background: #c3122e;
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
    }
    
    .chat-send-btn:hover {
        background: #ac031c;
    }

    .typing-indicator {
        display: none;
        padding: 12px 16px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        border-bottom-left-radius: 4px;
        align-self: flex-start;
        gap: 5px;
    }
    
    .typing-indicator span {
        width: 6px;
        height: 6px;
        background: #cbd5e1;
        border-radius: 50%;
        animation: typing 1.4s infinite ease-in-out both;
    }
    
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes typing {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }
</style>

<div id="aeronexa-chatbot">
    <div id="chatbot-window">
        <div class="chat-header">
            <h3><i class="fa-solid fa-robot"></i> Aeronexa AI <span class="status-dot"></span></h3>
            <button class="close-chat" onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="chat-body" id="chat-body">
            <div class="chat-msg msg-bot">
                Hello! 👋 I'm your Aeronexa AI Assistant. How can I help you with your travel plans today?
            </div>
            <div class="typing-indicator" id="chat-typing">
                <span></span><span></span><span></span>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" class="chat-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button class="chat-send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>
    <div id="chatbot-toggle" onclick="toggleChat()">
        <i class="fa-solid fa-message"></i>
    </div>
</div>

<script>
    function toggleChat() {
        const win = document.getElementById('chatbot-window');
        if (win.style.display === 'flex') {
            win.style.opacity = '0';
            win.style.transform = 'scale(0.9)';
            setTimeout(() => win.style.display = 'none', 300);
        } else {
            win.style.display = 'flex';
            setTimeout(() => {
                win.style.opacity = '1';
                win.style.transform = 'scale(1)';
                document.getElementById('chat-input').focus();
            }, 10);
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const msg = input.value.trim();
        if (!msg) return;
        
        input.value = '';
        
        // Add user msg
        addMessage(msg, 'user');
        
        // Show typing indicator
        const typing = document.getElementById('chat-typing');
        const chatBody = document.getElementById('chat-body');
        typing.style.display = 'flex';
        chatBody.appendChild(typing); // Move to bottom
        chatBody.scrollTop = chatBody.scrollHeight;
        
        // Fetch AI response
        fetch('/api/chatbot/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        })
        .then(res => res.json())
        .then(data => {
            typing.style.display = 'none';
            addMessage(data.reply, 'bot');
        })
        .catch(err => {
            typing.style.display = 'none';
            addMessage("I'm sorry, I am having trouble connecting to the servers right now.", 'bot');
        });
    }

    function addMessage(text, sender) {
        const chatBody = document.getElementById('chat-body');
        const div = document.createElement('div');
        div.className = `chat-msg msg-${sender}`;
        div.innerHTML = text;
        
        const typing = document.getElementById('chat-typing');
        chatBody.insertBefore(div, typing);
        chatBody.scrollTop = chatBody.scrollHeight;
    }
</script>
